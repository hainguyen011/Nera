<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nera Tactical Command</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sidepanel.css">
</head>

<body>
  <div class="header">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5">
      <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
    </svg>
    <h1>Nera Tactical Command</h1>
    <div class="status-dot"></div>
  </div>

  <div class="app-container">
    <!-- TAB 1: COMMAND CENTER -->
    <div id="command" class="tab-pane active">
      <div class="form-group">
        <label class="section-label">Neural Sentiment Radar</label>
        <div id="radarContainer" class="tactical-card radar-grid">
          <div class="radar-stat">
            <div class="stat-header">
              <span class="stat-name">POSITIVE</span>
              <span class="stat-value" id="stat-pos">0%</span>
            </div>
            <div class="progress-track">
              <div class="progress-bar" id="bar-pos" style="background: #10b981;"></div>
            </div>
          </div>
          <div class="radar-stat">
            <div class="stat-header">
              <span class="stat-name">NEGATIVE</span>
              <span class="stat-value" id="stat-neg">0%</span>
            </div>
            <div class="progress-track">
              <div class="progress-bar" id="bar-neg" style="background: #ef4444;"></div>
            </div>
          </div>
          <div class="radar-stat">
            <div class="stat-header">
              <span class="stat-name">SARCASTIC</span>
              <span class="stat-value" id="stat-sar">0%</span>
            </div>
            <div class="progress-track">
              <div class="progress-bar" id="bar-sar" style="background: #f59e0b;"></div>
            </div>
          </div>
          <div class="radar-stat">
            <div class="stat-header">
              <span class="stat-name">SERIOUS</span>
              <span class="stat-value" id="stat-ser">0%</span>
            </div>
            <div class="progress-track">
              <div class="progress-bar" id="bar-ser" style="background: #3b82f6;"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="section-label">Infiltration Log</label>
        <div class="terminal-card">
          <div id="logContainer">
            <div style="color: #3b82f6;">[SYSTEM] Nera Terminal initialized...</div>
            <div>[READY] Awaiting infiltration command.</div>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 2: SETTINGS -->
    <div id="settings" class="tab-pane">
      <div class="settings-grid">
        <div class="form-group">
          <label class="section-label">AI Provider</label>
          <select id="provider">
            <option value="groq">Groq (Llama 3)</option>
            <option value="gemini">Google Gemini</option>
            <option value="openai">OpenAI GPT</option>
          </select>
        </div>

        <div class="form-group">
          <label class="section-label">Stealth Protocol</label>
          <select id="stealthLevel">
            <option value="fast">Aggressive</option>
            <option value="standard" selected>Standard</option>
            <option value="human">Human</option>
            <option value="paranoid">Paranoid</option>
          </select>
        </div>

        <div class="form-group" style="display: flex; flex-direction: row; justify-content: space-between; align-items: center;">
          <label class="section-label" style="margin-bottom: 0;">Auto Reply Mode</label>
          <label style="position: relative; display: inline-block; width: 40px; height: 20px;">
            <input type="checkbox" id="autoReply" style="opacity: 0; width: 0; height: 0; position: absolute;">
            <span style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border, #27272a); transition: .4s; border-radius: 20px;">
              <span id="autoReplyThumb" style="position: absolute; content: ''; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%;"></span>
            </span>
          </label>
        </div>

        <div class="form-group full-width">
          <label class="section-label" id="apiKeyLabel">Authentication Key</label>
          <input type="password" id="apiKey" placeholder="Inject tactical key...">
        </div>

        <div id="modelGroup" class="form-group full-width" style="display: none;">
          <label class="section-label">Neural Model</label>
          <select id="model">
            <option value="">-- Awaiting Auth --</option>
          </select>
        </div>

        <div class="form-group">
          <label class="section-label">AI Persona</label>
          <select id="persona">
            <option value="Hawl">Elite (Hawl)</option>
            <option value="Friendly">Friendly</option>
            <option value="Sarcastic">Sarcastic</option>
            <option value="Professional">Professional</option>
            <option value="Funny">Chaos/Funny</option>
            <option value="Investigative">Investigative</option>
            <option value="Stealth">Stealth</option>
            <option value="Hype">Hype</option>
            <option value="Analytical">Analytical</option>
            <option value="Custom">Custom Prompt</option>
          </select>
        </div>

        <div class="form-group">
          <label class="section-label">Tone Nuance</label>
          <select id="tone">
            <option value="neutral">Neutral</option>
            <option value="witty">Witty</option>
            <option value="aggressive">Aggressive</option>
            <option value="polite">Polite</option>
          </select>
        </div>

        <div id="customGroup" class="form-group full-width" style="display: none;">
          <label class="section-label">Payload Instructions</label>
          <textarea id="customPrompt" placeholder="Inject custom tactical instructions..."></textarea>
        </div>
      </div>

      <button id="saveConfig" class="btn-save" style="width: 100%; border-radius: 8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        Save & Synchronize
      </button>
    </div>

    <!-- TAB 3: AGENT FORGE -->
    <div id="forge" class="tab-pane">
      <div class="settings-grid">
        <div class="form-group full-width">
          <label class="section-label">Agent Designation</label>
          <input type="text" id="agentName" placeholder="E.g., Nera-Seeder-01">
        </div>

        <div class="form-group full-width">
          <label class="section-label">Primary Mission Directive</label>
          <textarea id="missionDirective" rows="4" placeholder="Define the core mission and personality..."></textarea>
        </div>

        <div class="form-group">
          <label class="section-label">Target Audience</label>
          <select id="targetAudience">
            <option value="general">General</option>
            <option value="genz">Gen Z / Slang</option>
            <option value="professional">Professional</option>
            <option value="skeptical">Skeptical / Critics</option>
          </select>
        </div>

        <div class="form-group">
          <label class="section-label">Slang Level</label>
          <select id="slangLevel">
            <option value="none">Zero</option>
            <option value="low">Subtle</option>
            <option value="medium">Fluent</option>
            <option value="high">Native/Chaos</option>
          </select>
        </div>

        <div class="form-group">
          <label class="section-label">Formality</label>
          <select id="formality">
            <option value="natural">Natural</option>
            <option value="casual">Casual</option>
            <option value="formal">Formal</option>
          </select>
        </div>

        <div class="form-group">
          <label class="section-label">Length Limit</label>
          <select id="lengthLimit">
            <option value="short">Concise</option>
            <option value="medium" selected>Standard</option>
            <option value="long">Elaborate</option>
          </select>
        </div>
      </div>

      <button id="saveProfileBtn" class="btn-save" style="width: 100%; margin-top: 10px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
        </svg>
        Forge & Deploy Agent
      </button>

      <div style="margin-top: 32px;">
        <label class="section-label">Active Squad</label>
        <div id="profileList" style="display: flex; flex-direction: column; gap: 8px;">
          <!-- Profiles injected here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Dock -->
  <div class="tabs-nav">
    <button class="tab-btn active" data-tab="command">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
      </svg>
      <span>TERMINAL</span>
    </button>
    <button class="tab-btn" data-tab="settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span>SETTINGS</span>
    </button>
    <button class="tab-btn" data-tab="forge">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
      </svg>
      <span>FORGE</span>
    </button>
  </div>

  <div class="footer">
    <div class="footer-text">NERA INFILTRATOR v1.3.0</div>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>

</html>
