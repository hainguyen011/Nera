<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nera Tactical Command</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sidepanel.css">
</head>

<body>
  <div class="app-container">
    <!-- Status Indicator (Integrated) -->
    <div style="display: flex; align-items: center; padding: 32px 0 24px;">
      <img src="../../../../assets/icon.png" alt="Nera Logo" style="width: 22px; height: 22px; opacity: 0.9; margin-right: 12px;">
      <span style="font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--text); letter-spacing: 0.2em;">NERA ACTIVE</span>
    </div>

    <!-- TAB 1: COMMAND CENTER -->
    <div id="command" class="tab-pane active">
      <div class="form-group">
        <label class="section-label">NEURAL SENTIMENT RADAR</label>
        <div class="tactical-card radar-grid" id="radarContainer">
          <!-- POSITIVE -->
          <div class="radar-stat">
            <div class="stat-header">
              <span class="stat-name">POSITIVE</span>
              <span class="stat-value" id="stat-pos">0%</span>
            </div>
            <div class="progress-track">
              <div class="progress-bar" id="bar-pos" style="background: #10b981;"></div>
            </div>
          </div>
          <!-- NEGATIVE -->
          <div class="radar-stat">
            <div class="stat-header">
              <span class="stat-name">NEGATIVE</span>
              <span class="stat-value" id="stat-neg">0%</span>
            </div>
            <div class="progress-track">
              <div class="progress-bar" id="bar-neg" style="background: #ef4444;"></div>
            </div>
          </div>
          <!-- SARCASTIC -->
          <div class="radar-stat">
            <div class="stat-header">
              <span class="stat-name">SARCASTIC</span>
              <span class="stat-value" id="stat-sar">0%</span>
            </div>
            <div class="progress-track">
              <div class="progress-bar" id="bar-sar" style="background: #f59e0b;"></div>
            </div>
          </div>
          <!-- SERIOUS -->
          <div class="radar-stat">
            <div class="stat-header">
              <span class="stat-name">SERIOUS</span>
              <span class="stat-value" id="stat-ser">0%</span>
            </div>
            <div class="progress-track">
              <div class="progress-bar" id="bar-ser" style="background: #3b82f6;"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="section-label">INFILTRATION LOG</label>
        <div class="terminal-card">
          <div id="logContainer">
            <div style="color: var(--primary);">[SYSTEM] Nera Terminal initialized...</div>
            <div>[READY] Awaiting infiltration command.</div>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 2: SETTINGS -->
    <div id="settings" class="tab-pane">
      <div class="settings-grid">
        <div class="form-group">
          <label class="section-label">AI PROVIDER</label>
          <select id="provider">
            <option value="groq">Groq (Llama 3)</option>
            <option value="gemini">Google Gemini</option>
            <option value="openai">OpenAI GPT</option>
          </select>
        </div>

        <div class="form-group">
          <label class="section-label">STEALTH PROTOCOL</label>
          <select id="stealthLevel">
            <option value="fast">Aggressive</option>
            <option value="standard">Standard</option>
            <option value="human">Human</option>
            <option value="paranoid">Paranoid</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label class="section-label" id="apiKeyLabel">AUTHENTICATION KEY</label>
          <input type="password" id="apiKey" placeholder="Enter tactical key...">
        </div>

        <div id="modelGroup" class="form-group full-width" style="display: none;">
          <label class="section-label">NEURAL MODEL</label>
          <select id="model">
            <option value="">-- Awaiting Auth --</option>
          </select>
        </div>

        <div class="form-group">
          <label class="section-label">AI PERSONA</label>
          <select id="persona">
            <option value="Hawl">Elite (Hawl)</option>
            <option value="Friendly">Friendly</option>
            <option value="Sarcastic">Sarcastic</option>
            <option value="Professional">Professional</option>
            <option value="Funny">Chaos/Funny</option>
            <option value="Investigative">Investigative</option>
            <option value="Stealth">Stealth</option>
            <option value="Hype">Hype</option>
            <option value="Analytical">Analytical</option>
            <option value="Custom">Custom Prompt</option>
          </select>
        </div>

        <div class="form-group">
          <label class="section-label">DYNAMIC TONE</label>
          <select id="tone">
            <option value="neutral">Neutral</option>
            <option value="witty">Witty</option>
            <option value="aggressive">Aggressive</option>
            <option value="polite">Polite</option>
          </select>
        </div>

        <div id="customPersonaGroup" class="form-group full-width" style="display: none;">
          <label class="section-label">CUSTOM INSTRUCTIONS</label>
          <textarea id="customPersona" rows="4" placeholder="Define your custom agent behavior..."></textarea>
        </div>

        <div class="form-group full-width">
          <label class="section-label">ENGAGEMENT RULES</label>
          <textarea id="customContext" rows="3"
            placeholder="E.g. Always use Vietnamese, focus on tech..."></textarea>
        </div>
      </div>

      <button id="saveConfig" class="btn-save">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        Save & Synchronize
      </button>
    </div>
  </div>

  <!-- Floating Dock -->
  <div class="tabs-nav">
    <button class="tab-btn active" data-tab="command">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
        stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
      </svg>
      Radar
    </button>
    <button class="tab-btn" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
        stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
        </path>
      </svg>
      Settings
    </button>
  </div>

  <div class="footer">
    <div class="footer-text">NERA PROTOCOL V1.3.0 | BY I2F LABS</div>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>

</html>
