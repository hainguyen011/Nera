<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nera Control Center</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>⚡ NERA CONTROL</h1>
  <div class="status">SYSTEM STATUS: OPERATIONAL</div>

  <div class="form-group">
    <label for="provider">AI Provider</label>
    <select id="provider">
      <option value="groq">Groq (Llama 3 - Ultra Fast)</option>
      <option value="gemini">Google Gemini (Deep Context)</option>
      <option value="openai">OpenAI (Balanced)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="apiKey" id="apiKeyLabel">API Key</label>
    <input type="password" id="apiKey" placeholder="Nhập khóa bí mật...">
  </div>

  <div class="form-group">
    <label for="persona">Active Persona</label>
    <select id="persona">
      <option value="Hawl">Hawl (Elite/Sharp)</option>
      <option value="Friendly">Friendly (Warm/Kind)</option>
      <option value="Sarcastic">Sarcastic (Witty/Bite)</option>
      <option value="Professional">Professional</option>
      <option value="Funny">Chaos/Funny</option>
      <option value="Custom">-- Custom Ammo --</option>
    </select>
  </div>

  <div id="customGroup" class="form-group" style="display: none;">
    <label for="customPrompt">Custom Ammo (Instruction)</label>
    <textarea id="customPrompt" placeholder="Ví dụ: Hãy phản biện một cách lịch sự nhưng đanh thép..."></textarea>
  </div>

  <button id="saveBtn">Save Configuration</button>

  <div class="footer">
    Nera Infiltration Agent v1.1.0 | <a href="#">Terminal</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
